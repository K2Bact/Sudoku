<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle Board Grid Background Shadow -->
  <g filter="url(#dropShadow)">
    <rect x="76" y="76" width="360" height="360" rx="28" fill="#ffffff" opacity="0.96"/>
  </g>

  <!-- 3x3 Inner Grid Lines -->
  <rect x="88" y="88" width="336" height="336" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Thick Block Dividers -->
  <line x1="200" y1="88" x2="200" y2="424" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <line x1="312" y1="88" x2="312" y2="424" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <line x1="88" y1="200" x2="424" y2="200" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <line x1="88" y1="312" x2="424" y2="312" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>

  <!-- Iconic Number Symbols inside Grid -->
  <text x="256" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#1e293b" text-anchor="middle">9</text>
  
  <rect x="204" y="204" width="104" height="104" rx="12" fill="#eff6ff"/>
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#2563eb" text-anchor="middle">5</text>

  <text x="144" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#64748b" text-anchor="middle">3</text>
  <text x="368" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#1e293b" text-anchor="middle">7</text>

  <!-- Sparkling Golden Star / Achievement Pin -->
  <circle cx="394" cy="118" r="32" fill="#fbbf24" stroke="#ffffff" stroke-width="4"/>
  <path d="M 394 98 L 400 112 L 414 114 L 404 124 L 406 138 L 394 130 L 382 138 L 384 124 L 374 114 L 388 112 Z" fill="#ffffff"/>
</svg>
