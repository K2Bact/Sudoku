// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Defined here, not in variables.gradle: Gradle evaluates buildscript {}
    // before any `apply from`, so a variable from that file is not visible yet.
    ext.kotlinVersion = '2.4.10'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Required by @idleflowgames/capacitor-play-games, whose Android sources
        // are Kotlin. Its README omits this; without it the plugin's build.gradle
        // fails with "Could not find method kotlin()".
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// @idleflowgames/capacitor-play-games writes its Android sources in Kotlin and
// uses the kotlin { } DSL, but its own build.gradle never applies the Kotlin
// plugin (upstream bug: "Could not find method kotlin()"). Apply it on that
// module's behalf so node_modules never has to be hand-edited.
subprojects { sub ->
    if (sub.name == 'idleflowgames-capacitor-play-games') {
        sub.apply plugin: 'org.jetbrains.kotlin.android'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
